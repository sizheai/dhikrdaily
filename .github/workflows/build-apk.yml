name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build web app
      run: npm run build
    
    - name: Sync Capacitor
      run: npx cap sync android
    
    - name: Build APK with Gradle
      working-directory: ./android
      run: ./gradlew assembleRelease
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: dhikrdaily-apk
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
    
    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "android/app/build/outputs/apk/release/app-release-unsigned.apk"
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: v${{ github.run_number }}
        name: DhikrDaily v${{ github.run_number }}
        body: |
          DhikrDaily Android APK
          Built on Laylat al-Qadr 1447 AH (March 16, 2026)
          
          Made with ❤️ for the Ummah by Sizhe (Shahzad Ahmed)
